name: Release

# Runs when a v* tag is pushed (only the maintainer can create those; see the repository rulesets).
# Publishes the extension zip, its SHA256SUMS and a signed build provenance attestation:
#   gh attestation verify gnometangle@aaronfeingold.github.io.shell-extension.zip -R aaronfeingold/gnometangle

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: pnpm check
      - run: pnpm run pack
      - run: sha256sum ./*.shell-extension.zip | sed 's| \./| |' > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.shell-extension.zip'
      # The CHANGELOG.md section for this version goes first, then GitHub's list of merged PRs.
      - run: pnpm --silent release-notes > release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" ./*.shell-extension.zip SHA256SUMS
          --verify-tag --generate-notes --notes-file release-notes.md --title "$GITHUB_REF_NAME"

  # Uploads the released zip to extensions.gnome.org, where it waits for review like any upload.
  # Off until the repository variable EGO_PUBLISH is set to true; also needs the secrets EGO_USERNAME
  # and EGO_PASSWORD (the extensions.gnome.org account that owns the extension). See CONTRIBUTING.md.
  publish-ego:
    name: Upload to extensions.gnome.org
    needs: release
    if: vars.EGO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.shell-extension.zip'
      - name: Upload
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          api=https://extensions.gnome.org/api/v1
          token=$(jq -n --arg login "$EGO_USERNAME" --arg password "$EGO_PASSWORD" '{$login, $password}' \
            | curl -fsS -H 'Content-Type: application/json' --data @- "$api/accounts/login/" \
            | jq -r '.token.token')
          echo "::add-mask::$token"
          curl -fsS -H "Authorization: Token $token" \
            -F shell_license_compliant=true -F tos_compliant=true \
            -F "source=@$(ls ./*.shell-extension.zip)" \
            "$api/extensions"
