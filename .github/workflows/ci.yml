name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run pack
      - name: Validate GSettings schema
        run: |
          sudo apt-get install -y -qq libglib2.0-bin >/dev/null
          glib-compile-schemas --strict --dry-run dist/schemas
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: '*.shell-extension.zip'
          if-no-files-found: error

  smoke:
    name: GNOME Shell ${{ matrix.gnome }} smoke test
    needs: check
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            gnome: '46'
          - image: ubuntu:25.10
            gnome: '49'
          - image: ubuntu:26.04
            gnome: '50'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - run: scripts/smoke-container.sh
