name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A change that only touches Markdown or docs/ (the README images live there) skips the real work.
  # The jobs below still start and report success so the required checks on main are met; a
  # workflow-level paths-ignore would leave those checks pending and block docs PRs from merging.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pull requests check out a merge commit and main only takes squash merges, so HEAD^..HEAD is the
      # whole change in both cases.
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git diff --name-only HEAD^ HEAD | grep -Ev '\.md$|^docs/' || true)
          if [ -n "$code" ]; then
            printf 'Code changes:\n%s\n' "$code"
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo 'Docs-only change, skipping checks'
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Lint, typecheck, test, build
    needs: changes
    runs-on: ubuntu-latest
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.CODE != 'true'
        run: echo 'Docs-only change, nothing to check'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.CODE == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CODE == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.CODE == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.CODE == 'true'
        run: pnpm lint
      - if: env.CODE == 'true'
        run: pnpm format:check
      - if: env.CODE == 'true'
        run: pnpm typecheck
      - if: env.CODE == 'true'
        run: pnpm test
      - if: env.CODE == 'true'
        run: pnpm run pack
      - name: Validate GSettings schema
        if: env.CODE == 'true'
        run: |
          sudo apt-get install -y -qq libglib2.0-bin >/dev/null
          glib-compile-schemas --strict --dry-run dist/schemas
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.CODE == 'true'
        with:
          name: extension-zip
          path: '*.shell-extension.zip'
          if-no-files-found: error

  smoke:
    name: GNOME Shell ${{ matrix.gnome }} smoke test
    needs: [changes, check]
    runs-on: ubuntu-latest
    # Docs-only changes run on the bare runner instead of pulling the GNOME image.
    container: ${{ needs.changes.outputs.code == 'true' && matrix.image || '' }}
    timeout-minutes: 20
    env:
      CODE: ${{ needs.changes.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            gnome: '46'
          - image: ubuntu:25.10
            gnome: '49'
          - image: ubuntu:26.04
            gnome: '50'
          - image: ubuntu:26.10
            gnome: '51'
          # Named apart so the Ubuntu jobs keep their required-check names.
          - image: registry.fedoraproject.org/fedora:44
            gnome: '50 (Fedora 44)'
          - image: registry.fedoraproject.org/fedora:45
            gnome: '51 (Fedora 45)'
    steps:
      - if: env.CODE != 'true'
        run: echo 'Docs-only change, nothing to smoke test'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.CODE == 'true'
        with:
          name: extension-zip
      - if: env.CODE == 'true'
        run: scripts/smoke-container.sh
